# DeTSP 策略与风控参数示例：复制为 config.yaml 后修改。
# 加载时严格校验，未知键会直接报错（见 core/config.py）。

engine:
  cycle_seconds: 20

risk:
  min_corridor_pct: 3.0     # 开仓门槛：估算强平距离低于此值不开仓
  close_corridor_pct: 1.5   # 平仓线：任一腿强平距离低于此值双腿同平
  max_consecutive_errors: 3

venues:
  arcus:       { mode: paper }
  lighter:     { mode: paper }
  lighter_rh:  { mode: paper }
  hyperliquid: { mode: paper }
  entropy:     { mode: paper }
  tradexyz:    { mode: paper }
  aster:       { mode: paper }

# 任务列表：引擎按此组装策略（strategy 三选一，params 见各策略参数类）。
# 同一 (场所, 账户, 币种) 只能被一个任务占用，冲突的任务会被拒绝启动。
tasks:
  - name: grid-btc-arcus
    strategy: grid
    venue: arcus
    symbol: BTC
    params:
      lower: 55000
      upper: 65000
      grid_count: 10
      qty_per_grid: 0.01
      mode: neutral
      out_of_range_action: close
  - name: hedge-arcus-lighter
    strategy: rotation_hedge
    params:
      symbol: ETH
      venue_a: arcus
      venue_b: lighter
      notional_usd: 200
      hold_seconds: 3600
      leverage_a: 5
      leverage_b: 5
  - name: arb-sndk
    strategy: premium_arb
    params:
      symbol: SNDK
      base_venue: entropy
      hedge_venue: lighter_rh
      midline_bps: 5
      upper_bps: 30
      lower_bps: 30
      max_position_usd: 1000
      max_order_notional_usd: 500
