# DeTSP 策略与风控参数示例：复制为 config.yaml 后修改。
# 加载时严格校验，未知键会直接报错（见 core/config.py）。
#
# ⚠ 安全约定：下面的 tasks 示例默认全部注释——它们只是结构
# 说明，里面的区间/中枢等数字是占位符，**不是可照抄的实盘参数**：
# - 中性网格的区间必须按当下行情与波动自己设定；
# - 溢价套利的 midline_bps（中枢）必须先用自带盘口录制器采样、
#   再用 tools 分析实测得出，猜测值会直接亏钱；
# - 启用任何任务前先 paper 跑通、再过实盘预检。
# caps 是三层名义金额上限（USD），<=0 或不写 = 不限；强烈建议
# 实盘时至少设置 global_usd 与各策略上限。strategies 层的口径
# 是「该任务全部腿的名义合计」，不是单条腿。

engine:
  cycle_seconds: 20

# 面板各策略页机会区的观察列表（币种）；不写时用默认
# BTC / ETH / SOL / HYPE / AAPL / SNDK。注意 Entropy、trade.xyz
# 只有股票类标的，加密币在那两所会显示「未上市」，属正常。
# watchlist: [BTC, ETH, SOL, HYPE, AAPL, SNDK]

risk:
  min_corridor_pct: 3.0     # 开仓门槛：估算强平距离低于此值不开仓
  close_corridor_pct: 1.5   # 平仓线：任一腿强平距离低于此值双腿同平
  max_consecutive_errors: 3

caps:
  global_usd: 0             # 全局总名义上限（USD），0=不限
  venues: {}                # 如 { arcus: 5000 }
  strategies: {}            # 键为任务名，如 { hgrid-btc: 3000 }

venues:
  arcus:       { mode: paper }
  lighter:     { mode: paper }
  lighter_rh:  { mode: paper }
  hyperliquid: { mode: paper }
  entropy:     { mode: paper }
  tradexyz:    { mode: paper }
  aster:       { mode: paper }

# 任务列表：引擎按此组装策略（strategy 三选一：hedged_grid /
# premium_arb / funding_carry；旧名 grid、volume_loop 与
# rotation_hedge 已移除，写了会在加载时报错并提示可用策略）。
# 任务名（name）必填且唯一，它是归属与账本的标识。
# 同一 (场所, 币种) 只能被一个任务占用（双腿策略占两个场所），
# 重复配置在加载时直接报错。
# run_mode（任务顶层字段，可选）：四值——manual = 自主（两腿/
# 标的/金额都自己定，点开仓立即开、手动平仓）；semi_fixed =
# 半自动·固定标的（定死一个标的，系统按条件开→平→再开循环）；
# semi_auto = 半自动·自动选标（定两腿/金额/条件，系统每轮重新
# 选标循环）；full_auto = 全自动（只定策略/金额/风险档，两腿、
# 标的、参数系统全定）。缺省 manual；旧值 auto 自动按 semi_auto
# 处理。自动选标类任务（semi_auto / full_auto）按「该场所任意
# 币种」占位，与同场所的其他任务都算冲突。
# run_preset（任务顶层字段，可选）：仅 full_auto 用的风险档，
# conservative（保守）/ neutral（中性，缺省）/ aggressive（激进）。
# amount_usd（任务顶层字段，可选）：仅 full_auto 的中性网格用，
# 填目标总名义（USD），系统按它反推每格量。
# 启用示例：去掉对应行首的 "# "，并把占位符换成自己实测/设定的值。
